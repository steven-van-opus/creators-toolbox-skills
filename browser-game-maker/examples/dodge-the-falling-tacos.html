<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dodge the Falling Tacos</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2b1d3a;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #mute {
    position: fixed; top: 10px; right: 10px; width: 44px; height: 44px;
    border: 0; border-radius: 22px; background: rgba(255,255,255,0.18);
    color: #fff; font: 20px system-ui, sans-serif; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Dodge the Falling Tacos game"></canvas>
<button id="mute" aria-label="Toggle sound">&#128263;</button>
<script>
(() => {
  'use strict';

  // Logical world size. Everything is drawn in these units and scaled to fit.
  const W = 400, H = 700;
  const GROUND = H - 70;
  const BEST_KEY = 'dodge-the-falling-tacos.best';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const muteBtn = document.getElementById('mute');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let view = { scale: 1, ox: 0, oy: 0, cw: 0, ch: 0 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const scale = Math.min(cw / W, ch / H);
    view = { scale, ox: (cw - W * scale) / 2, oy: (ch - H * scale) / 2, cw, ch };
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ---------- storage ----------
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* private mode */ }
  }

  // ---------- sound (off until the player turns it on) ----------
  let audio = null;
  let muted = true;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), t + dur);
      gain.gain.setValueAtTime(vol || 0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) { /* audio unavailable, keep playing */ }
  }
  function toggleMute() {
    muted = !muted;
    muteBtn.innerHTML = muted ? '&#128263;' : '&#128264;';
    if (!muted) beep(660, 0.08, 'triangle', 0.06);
  }
  muteBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });

  // ---------- game state ----------
  let state = 'start';
  let best = loadBest();
  let newBest = false;
  let overAt = 0;
  let score, elapsed, spawnTimer, fallSpeed, tacos, particles, shake, flash, player;

  function reset() {
    score = 0;
    elapsed = 0;
    spawnTimer = 0.4;
    fallSpeed = 220;
    tacos = [];
    particles = [];
    shake = 0;
    flash = 0;
    newBest = false;
    player = { x: W / 2, vx: 0, w: 46, h: 54, squash: 0, blink: 0 };
    input.target = null;
  }

  const input = { left: false, right: false, target: null, pointerDown: false };
  reset();

  function startGame() {
    reset();
    state = 'playing';
    beep(520, 0.1, 'triangle', 0.07);
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    shake = reduceMotion ? 0 : 14;
    flash = 1;
    burst(player.x, GROUND - player.h / 2, 30, ['#ffffff', '#ff5d5d', '#ffd166']);
    if (score > best) { best = score; newBest = true; saveBest(best); }
    beep(180, 0.35, 'sawtooth', 0.09);
  }

  function primaryAction() {
    if (state === 'start') startGame();
    else if (state === 'over' && performance.now() - overAt > 400) startGame();
  }

  // ---------- input ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; input.target = null; }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; input.target = null; }
    if (k === ' ' || k === 'Enter') primaryAction();
    if (k === 'm' || k === 'M') toggleMute();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  });

  function toWorldX(clientX) {
    return (clientX - view.ox) / view.scale;
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    input.pointerDown = true;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
    if (state === 'playing') input.target = toWorldX(e.clientX);
    else primaryAction();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (input.pointerDown && state === 'playing') input.target = toWorldX(e.clientX);
  });
  const endPointer = () => { input.pointerDown = false; input.target = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- helpers ----------
  function burst(x, y, n, colors) {
    for (let i = 0; i < n && particles.length < 160; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 260;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 120,
        life: 0.5 + Math.random() * 0.5,
        max: 1,
        r: 2 + Math.random() * 4,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
  }

  function spawnTaco() {
    const r = 22 + Math.random() * 8;
    tacos.push({
      x: r + Math.random() * (W - r * 2),
      y: -r,
      r,
      vy: fallSpeed * (0.85 + Math.random() * 0.35),
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 4
    });
  }

  // ---------- update ----------
  function update(dt) {
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 3);
    player.squash = Math.max(0, player.squash - dt * 5);
    player.blink -= dt;
    if (player.blink < -3) player.blink = 0.15;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 600 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state !== 'playing') return;

    elapsed += dt;
    // Ramp: falling speed and spawn rate both grow with time survived.
    fallSpeed = 220 + elapsed * 14;
    const spawnEvery = Math.max(0.22, 0.85 - elapsed * 0.018);

    // Player movement: keys accelerate, pointer drags toward a target.
    const accel = 2600, maxV = 420;
    let dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (input.target !== null) {
      const dx = input.target - player.x;
      dir = Math.abs(dx) < 4 ? 0 : Math.sign(dx);
      if (Math.abs(dx) < 30) player.vx = dx * 10;
    }
    // Turning around gets extra grip so changing direction feels instant.
    if (dir !== 0) player.vx += dir * accel * (dir * player.vx < 0 ? 3 : 1) * dt;
    else player.vx *= Math.pow(0.0005, dt);
    player.vx = Math.max(-maxV, Math.min(maxV, player.vx));
    const prevX = player.x;
    player.x += player.vx * dt;
    const half = player.w / 2;
    if (player.x < half) { player.x = half; player.vx = 0; }
    if (player.x > W - half) { player.x = W - half; player.vx = 0; }
    if (Math.abs(player.x - prevX) > 0.5 && Math.random() < 0.3) {
      particles.push({ x: player.x - Math.sign(player.vx) * 18, y: GROUND - 2, vx: -player.vx * 0.2, vy: -40, life: 0.3, max: 0.3, r: 2.5, c: '#c79a6b' });
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnTaco(); spawnTimer = spawnEvery; }

    // Player hitbox is a bit smaller than the drawing so close calls feel fair.
    const px = player.x, py = GROUND - player.h / 2, pr = player.w * 0.38;
    for (let i = tacos.length - 1; i >= 0; i--) {
      const t = tacos[i];
      t.y += t.vy * dt;
      t.rot += t.spin * dt;
      const dx = t.x - px, dy = t.y - py;
      const hit = t.r * 0.7 + pr;
      if (dx * dx + dy * dy < hit * hit) { gameOver(); return; }
      if (t.y - t.r > GROUND) {
        tacos.splice(i, 1);
        score += 1;
        player.squash = 1;
        burst(t.x, GROUND, 8, ['#ffd166', '#8bd450', '#e85d3b']);
        beep(880 + Math.min(score, 40) * 10, 0.05, 'square', 0.04);
      }
    }
  }

  // ---------- draw ----------
  function drawTaco(t) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    const r = t.r;
    // shell
    ctx.fillStyle = '#f4b942';
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    // fillings peeking out of the top edge
    ctx.fillStyle = '#6cc04a';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(i * r * 0.32, -r * 0.08, r * 0.2, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = '#d94a2b';
    ctx.beginPath(); ctx.arc(-r * 0.4, -r * 0.18, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.2, r * 0.12, 0, Math.PI * 2); ctx.fill();
    // shell lines
    ctx.strokeStyle = '#c98a1c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.75, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    const sq = player.squash;
    const sx = 1 + sq * 0.18, sy = 1 - sq * 0.15;
    const lean = Math.max(-0.25, Math.min(0.25, player.vx / 1600));
    ctx.save();
    ctx.translate(player.x, GROUND);
    ctx.rotate(lean);
    ctx.scale(sx, sy);
    const w = player.w, h = player.h;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 2, w * 0.55, 6, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = state === 'over' ? '#ff8a8a' : '#5ec8f2';
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.lineTo(-w / 2, -h + w / 2);
    ctx.arc(0, -h + w / 2, w / 2, Math.PI, 0);
    ctx.lineTo(w / 2, 0);
    ctx.closePath();
    ctx.fill();
    // eyes
    const eyeY = -h + w / 2 + 2;
    const look = Math.max(-3, Math.min(3, player.vx / 100));
    if (state === 'over') {
      ctx.strokeStyle = '#1c1530'; ctx.lineWidth = 3;
      for (const ex of [-10, 10]) {
        ctx.beginPath(); ctx.moveTo(ex - 5, eyeY - 5); ctx.lineTo(ex + 5, eyeY + 5);
        ctx.moveTo(ex + 5, eyeY - 5); ctx.lineTo(ex - 5, eyeY + 5); ctx.stroke();
      }
    } else if (player.blink > 0) {
      ctx.strokeStyle = '#1c1530'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-15, eyeY); ctx.lineTo(-5, eyeY); ctx.moveTo(5, eyeY); ctx.lineTo(15, eyeY); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-10, eyeY, 7, 0, Math.PI * 2); ctx.arc(10, eyeY, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c1530';
      ctx.beginPath(); ctx.arc(-10 + look, eyeY - 1, 3.5, 0, Math.PI * 2); ctx.arc(10 + look, eyeY - 1, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    // mouth: open and worried when a taco is close overhead
    let worried = false;
    for (const t of tacos) if (Math.abs(t.x - player.x) < 60 && t.y > GROUND - 260 && t.y < GROUND - h) worried = true;
    ctx.fillStyle = '#1c1530';
    ctx.beginPath();
    if (worried || state === 'over') ctx.ellipse(0, eyeY + 16, 5, 6, 0, 0, Math.PI * 2);
    else ctx.ellipse(0, eyeY + 14, 7, 3, 0, 0, Math.PI);
    ctx.fill();
    ctx.restore();
  }

  function text(str, x, y, size, color, align) {
    ctx.font = '800 ' + size + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 6);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(28,21,48,0.85)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }

  function draw(now) {
    ctx.fillStyle = '#2b1d3a';
    ctx.fillRect(0, 0, view.cw, view.ch);

    ctx.save();
    const sx = shake ? (Math.random() - 0.5) * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(view.ox + sx, view.oy + sy);
    ctx.scale(view.scale, view.scale);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ff9a6b');
    g.addColorStop(0.6, '#ffcf8a');
    g.addColorStop(1, '#ffe6b0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // sun
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(310, 140, 60, 0, Math.PI * 2); ctx.fill();
    // cacti
    ctx.fillStyle = '#4f9a5a';
    for (const cx of [60, 330]) {
      ctx.fillRect(cx - 8, GROUND - 90, 16, 90);
      ctx.fillRect(cx - 28, GROUND - 60, 12, 30);
      ctx.fillRect(cx - 28, GROUND - 42, 24, 10);
      ctx.fillRect(cx + 16, GROUND - 75, 12, 30);
      ctx.fillRect(cx + 4, GROUND - 52, 24, 10);
    }
    // ground
    ctx.fillStyle = '#d8a46e';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#c48d58';
    ctx.fillRect(0, GROUND, W, 6);

    for (const t of tacos) drawTaco(t);
    drawPlayer();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4));
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'playing') {
      text(String(score), W / 2, 60, 52, '#fff');
    } else if (state === 'start') {
      ctx.fillStyle = 'rgba(28,21,48,0.45)';
      ctx.fillRect(0, 0, W, H);
      text('DODGE THE', W / 2, 190, 38, '#ffd166');
      text('FALLING TACOS', W / 2, 236, 38, '#ffd166');
      text('Arrow keys or A / D to move', W / 2, 320, 18, '#fff');
      text('On a phone, drag left and right', W / 2, 348, 18, '#fff');
      const pulse = 1 + Math.sin(now / 250) * 0.05;
      ctx.save(); ctx.translate(W / 2, 430); ctx.scale(pulse, pulse);
      text('Tap or press Space to start', 0, 0, 22, '#fff');
      ctx.restore();
      text('Best: ' + best, W / 2, 490, 20, '#ffe6b0');
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(28,21,48,0.55)';
      ctx.fillRect(0, 0, W, H);
      text('TACO\'D!', W / 2, 200, 54, '#ff7a5c');
      text('Score: ' + score, W / 2, 285, 30, '#fff');
      text((newBest ? 'New best! ' : 'Best: ') + best, W / 2, 330, 22, newBest ? '#ffd166' : '#ffe6b0');
      if (performance.now() - overAt > 400) text('Tap or press Space to play again', W / 2, 420, 19, '#fff');
    }

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.7).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    if (!document.hidden) update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(frame);

  // Read-only handle for automated self-checks.
  window.__game = {
    get state() { return state; },
    get score() { return score; },
    get best() { return best; },
    get playerX() { return player.x; },
    get tacos() { return tacos.length; }
  };
})();
</script>
</body>
</html>
