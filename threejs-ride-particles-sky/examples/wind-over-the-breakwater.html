<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind over the Breakwater | Three.js atmosphere study</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; color: #fff7df; background: #233c52; font: 16px system-ui, sans-serif; }
  main { min-height: 100svh; position: relative; background: linear-gradient(#233c52, #a8968d); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .panel { position: absolute; z-index: 1; top: 0; left: 0; max-width: min(100vw, 460px); padding: clamp(22px, 6vw, 78px); }
  h1, p { margin: 0; text-shadow: 0 2px 14px #0e1f2b; }
  h1 { font: 500 clamp(38px, 6vw, 76px)/.94 Georgia, serif; letter-spacing: -.05em; }
  p { margin-top: 14px; line-height: 1.45; }
  .controls { position: absolute; z-index: 1; bottom: clamp(14px, 4vw, 52px); left: clamp(22px, 6vw, 78px); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #182a39f0; border-radius: 6px; }
  input, button { min-height: 44px; accent-color: #ffe2a9; }
  input { width: clamp(75px, 18vw, 145px); }
  button { padding: 0 8px; color: inherit; border: none; background: transparent; font: inherit; }
  button:focus-visible { outline: 2px solid #ffe2a9; outline-offset: 2px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Wind over the Breakwater</h1>
    <p>Watch the sea spray near the camera and the clouds farther out. Change the light or pause the scene.</p>
    <p id="fallback" hidden>The scene needs WebGL 2.</p>
  </div>
  <div class="controls">
    <button type="button" id="play">Pause</button>
    <label for="light">Daylight</label>
    <input id="light" type="range" min="0" max="100" value="64">
  </div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const main = document.querySelector('main');
const play = document.querySelector('#play');
const daylight = document.querySelector('#light');

function start() {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('webgl2', { alpha: true, antialias: true });
  if (!context) {
    document.querySelector('#fallback').hidden = false;
    document.querySelector('.controls').hidden = true;
    return;
  }
  main.prepend(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, context, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x748e98, 0.012);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 330);
  camera.position.set(0, 2.45, 6);
  camera.lookAt(-4.2, 1.8, -24);

  const light = new THREE.HemisphereLight(0xf9d5ad, 0x4b6687, 1.5);
  scene.add(light);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(350, 400), new THREE.MeshStandardMaterial({ color: 0x395d73, roughness: 0.96 }));
  sea.rotation.x = -Math.PI / 2;
  sea.position.set(0, -0.27, -150);
  scene.add(sea);
  const stones = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1), new THREE.MeshStandardMaterial({ color: 0x5b6567, flatShading: true }), 24);
  const transform = new THREE.Object3D();
  for (let index = 0; index < stones.count; index++) {
    transform.position.set(index % 2 === 0 ? -8.3 : 7.2, -0.08, 8 - index * 3.4);
    transform.rotation.set(index * 0.64, index * 1.86, index * 0.22);
    transform.scale.set(2.2, 0.8 + (index % 3) * 0.38, 2.1);
    transform.updateMatrix();
    stones.setMatrixAt(index, transform.matrix);
  }
  scene.add(stones);

  function cloudTexture() {
    const map = document.createElement('canvas');
    map.width = 128;
    map.height = 64;
    const paint = map.getContext('2d');
    for (const [x, y, radius] of [[30, 32, 23], [51, 26, 24], [72, 29, 23], [93, 36, 22], [55, 39, 24]]) {
      const gradient = paint.createRadialGradient(x, y, 2, x, y, radius);
      gradient.addColorStop(0, 'rgba(255,255,255,0.66)');
      gradient.addColorStop(0.45, 'rgba(255,255,255,0.40)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      paint.fillStyle = gradient;
      paint.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
    return new THREE.CanvasTexture(map);
  }

  const cloudMaterial = new THREE.SpriteMaterial({ map: cloudTexture(), opacity: 0.68, depthWrite: false, fog: false });
  const cloudAnchors = [[-43, 19, -125], [8, 18, -166], [38, 24, -175], [70, 19, -156], [-68, 20, -184], [-10, 22, -192]];
  const clouds = cloudAnchors.map(([x, y, z], index) => {
    const cloud = new THREE.Sprite(cloudMaterial);
    cloud.position.set(x, y, z);
    cloud.scale.set(50 + index * 7, 15 + index % 3 * 4, 1);
    scene.add(cloud);
    return cloud;
  });

  THREE.MathUtils.seededRandom(3498);
  const population = (matchMedia('(max-width: 600px)').matches ? 280 : 620);
  const seed = Float32Array.from({ length: population }, () => THREE.MathUtils.seededRandom());
  const positions = new Float32Array(population * 3);
  for (let index = 0; index < population; index++) {
    positions.set([(THREE.MathUtils.seededRandom() - 0.5) * 17,
      0.14 + THREE.MathUtils.seededRandom() ** 1.7 * 6,
      THREE.MathUtils.seededRandom() * 56], index * 3);
  }
  const field = new THREE.BufferGeometry();
  field.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  field.setAttribute('grain', new THREE.BufferAttribute(seed, 1));

  const sprayMaterial = new THREE.ShaderMaterial({
    uniforms: {
      flow: { value: 0 }, ripple: { value: 0 }, pixelScale: { value: 1 },
      glow: { value: new THREE.Color(0xffedd5) }
    },
    transparent: true,
    depthTest: true,
    depthWrite: false,
    vertexShader: `
      attribute float grain;
      uniform float flow;
      uniform float ripple;
      uniform float pixelScale;
      varying float opacity;
      void main() {
        float station = mod(position.z + flow, 56.0);
        vec3 p = vec3(position.x + sin(ripple + grain * 9.0) * 0.55,
          position.y + cos(ripple * 0.7 + grain * 11.0) * 0.12, station - 52.0);
        vec4 viewPoint = modelViewMatrix * vec4(p, 1.0);
        opacity = smoothstep(0.0, 10.0, station) * (1.0 - smoothstep(48.0, 56.0, station));
        gl_PointSize = pixelScale * clamp((5.0 + 12.0 * grain) / max(1.0, -viewPoint.z), 1.0, 6.0);
        gl_Position = projectionMatrix * viewPoint;
      }`,
    fragmentShader: `
      uniform vec3 glow;
      varying float opacity;
      void main() {
        float edge = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(glow, (1.0 - smoothstep(0.08, 0.5, edge)) * opacity * 0.75);
        #include <colorspace_fragment>
      }`
  });
  const spray = new THREE.Points(field, sprayMaterial);
  spray.frustumCulled = false;
  spray.renderOrder = 1;
  scene.add(spray);

  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const night = new THREE.Color(0x203551);
  const noon = new THREE.Color(0x91adb9);
  const sky = new THREE.Color();
  const softGold = new THREE.Color(0xffe1aa);
  const midnightBlue = new THREE.Color(0x789ece);
  let active = !motion.matches;
  let time = 0;
  let previous;
  let request;

  function draw() {
    const sun = Number(daylight.value) / 100;
    light.intensity = 0.4 + sun * 2.2;
    light.color.copy(midnightBlue).lerp(softGold, sun);
    cloudMaterial.color.copy(midnightBlue).lerp(softGold, sun);
    sprayMaterial.uniforms.glow.value.copy(midnightBlue).lerp(softGold, sun);
    scene.fog.color.copy(night).lerp(noon, sun);
    sky.copy(night).lerp(noon, sun * 0.65);
    main.style.background = `linear-gradient(${sky.getStyle()},${scene.fog.color.getStyle()})`;
    sprayMaterial.uniforms.flow.value = (time * 10) % 56;
    sprayMaterial.uniforms.ripple.value = time % (Math.PI * 20);
    clouds.forEach((cloud, index) => {
      cloud.position.x = cloudAnchors[index][0] + Math.sin(time * 0.07 + index * 0.6) * 8;
    });
    renderer.render(scene, camera);
    canvas.dataset.time = time.toFixed(2);
    canvas.dataset.light = sun.toFixed(2);
    canvas.dataset.particleCount = population;
  }

  function frame(now) {
    if (previous !== undefined) time += Math.min((now - previous) / 1000, 0.1);
    previous = now;
    draw();
    request = requestAnimationFrame(frame);
  }

  function setPlaying(value) {
    if (value === active && request !== undefined) return;
    active = value;
    play.textContent = active ? 'Pause' : 'Play';
    previous = undefined;
    if (active) request = requestAnimationFrame(frame);
    else cancelAnimationFrame(request);
  }

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
    sprayMaterial.uniforms.pixelScale.value = renderer.getPixelRatio();
    draw();
  }

  play.addEventListener('click', () => setPlaying(!active));
  daylight.addEventListener('input', draw);
  motion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
  addEventListener('visibilitychange', () => { previous = undefined; });
  addEventListener('resize', resize);
  setPlaying(active);
  resize();
}
start();
</script>
</body>
</html>
